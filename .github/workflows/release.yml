name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente a publicar (ex.: v1.2.0); não substitui releases publicados"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish installer
    runs-on: windows-latest

    steps:
      - name: Checkout tagged version
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Configure .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Read and validate release version
        id: version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:\.\d+)?$') { throw "Informe uma tag vmajor.minor.patch." }
          $version = $env:RELEASE_TAG.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') { throw "A tag deve usar o formato vmajor.minor.patch." }
          [xml]$project = Get-Content .\src\Sinalo.App\Sinalo.App.csproj
          if ($project.Project.PropertyGroup.Version -ne $version) { throw "A tag v$version nao corresponde a versao $($project.Project.PropertyGroup.Version) do projeto." }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Refuse to overwrite a published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) { throw "A release $env:RELEASE_TAG ja existe; nao sera substituida." }
          $global:LASTEXITCODE = 0

      - name: Prepare pinned media tools
        shell: pwsh
        run: .\eng\prepare-video-download-tools.ps1

      - name: Generate installer
        shell: pwsh
        run: .\releaser.ps1 -Version ${{ steps.version.outputs.value }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: Sinalo-Setup-win-x64-${{ steps.version.outputs.value }}
          path: .release/installer/Sinalo-Setup-win-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload installer checksum
        uses: actions/upload-artifact@v7
        with:
          name: Sinalo-Setup-win-x64-${{ steps.version.outputs.value }}-sha256
          path: .release/installer/Sinalo-Setup-win-x64.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $installer = ".release\installer\Sinalo-Setup-win-x64.exe"
          $checksum = "$installer.sha256"
          $changelog = Get-Content .\CHANGELOG.md -Raw
          $notes = [regex]::Match($changelog, "(?ms)^## $([regex]::Escape($env:VERSION))\b.*?(?=^## |\z)").Value.Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) { $notes = "Sinalo $env:VERSION" }
          $notesPath = ".release\release-notes.md"
          Set-Content -LiteralPath $notesPath -Value $notes -NoNewline
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG $installer $checksum --title "Sinalo $env:VERSION" --notes-file $notesPath
          }
          else {
            throw "A release $env:TAG ja existe; nao sera substituida."
          }
